[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"apps/core/permissions.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
# Os testes de cada app moram dentro do proprio app; `tests/` continua aqui
# porque os testes transversais (admin, RBAC, permissoes) foram escritos la.
testpaths = ["apps"]
addopts = "--reuse-db"
markers = [
    "sequencial: liga a trava de progressão em ordem da trilha",
    "integracao: usa o banco (aplicado no conftest); a CI roda à parte",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/tests/*",
    "*/tests.py",
    "*/migrations/*",
    "*/__init__.py",
    "config/asgi.py",
    "config/wsgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["apps/trilhas", "apps/autoria", "apps/correcao", "apps/conquistas", "apps/ranking", "apps/auditoria", "apps/gamificacao", "apps/core"]
exclude = "apps/[a-z]+/migrations/"

# ponytail: contas, progressao e clas somam 574 erros no strict (quase todos
# anotacao faltando, sem bug de tipo real). Ficam fora ate uma rodada so de
# anotacao; tirar o app desta lista e rodar mypy mostra o que falta.
[[tool.mypy.overrides]]
module = ["apps.contas.*", "apps.progressao.*", "apps.clas.*", "config.*"]
ignore_errors = true

# Os testes ficam fora do mypy. O idioma `cls.x = ...` dentro de setUpTestData
# e invisivel para o django-stubs, que reporta attr-defined em todo atributo
# assim. O que o strict protege e o codigo de producao.
[[tool.mypy.overrides]]
module = ["apps.trilhas.tests.*", "apps.autoria.tests.*", "apps.correcao.tests.*", "apps.conquistas.tests.*", "apps.ranking.tests.*", "apps.auditoria.tests.*", "apps.gamificacao.tests.*", "tests.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
