# Site do CodeQuest, montado no container nginx do docker-compose.yml.
# So HTTP por enquanto: o bloco 443 com o certificado entra quando o dominio
# apontar para a VPS.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Codigo do aluno e conteudo de autoria cabem com folga.
    client_max_body_size 1m;

    # Tudo vai ao Next; ele mesmo repassa /api/* ao Django (next.config.ts).
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SOBRESCREVE, nao anexa: o Next repassa o cabecalho que chega, e o
        # throttle por IP (NUM_PROXIES=1) le o ultimo item. Anexar deixaria o
        # aluno forjar o proprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
