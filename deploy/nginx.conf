# Site do CodeQuest, montado no container nginx do docker-compose.yml.
# A Cloudflare fica na frente (proxy laranja, SSL "Full (strict)") e fala com
# este servidor por HTTPS, com o Origin Certificate em deploy/certs/.

# Faixas da Cloudflare (https://www.cloudflare.com/ips/). Mudam raramente;
# conferir se o site passar a recusar visitantes legitimos.
#
# IP real do visitante: sem isto o $remote_addr seria o da Cloudflare e todos
# os alunos dividiriam o mesmo balde de throttle e de bloqueio de login. So
# conexoes vindas destas faixas podem informar o CF-Connecting-IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Quem conecta direto no IP do servidor, pulando a Cloudflare (e o WAF dela),
# e recusado. Olha o IP da CONEXAO ($realip_remote_addr), nao o do visitante.
# O ufw nao serve para isto: o Docker publica as portas por fora dele.
geo $realip_remote_addr $via_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    if ($via_cloudflare = 0) {
        return 444;
    }
    return 301 https://codequest.dev.br$request_uri;
}

# www e qualquer outro nome caem no dominio principal.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    if ($via_cloudflare = 0) {
        return 444;
    }
    return 301 https://codequest.dev.br$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name codequest.dev.br;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($via_cloudflare = 0) {
        return 444;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Codigo do aluno e conteudo de autoria cabem com folga.
    client_max_body_size 1m;

    # Tudo vai ao Next; ele mesmo repassa /api/* ao Django (next.config.ts).
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # SOBRESCREVE, nao anexa: o Next repassa o cabecalho que chega, e o
        # throttle por IP (NUM_PROXIES=1) le o ultimo item. $remote_addr ja e
        # o IP real do aluno (real_ip acima), entao ele nao consegue forja-lo.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
