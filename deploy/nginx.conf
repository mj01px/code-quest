# Site do CodeQuest. Copiar para /etc/nginx/sites-available/codequest, trocar
# codequest.example.com pelo domínio real e emitir o certificado com
#   certbot --nginx -d codequest.example.com

server {
    listen 80;
    server_name codequest.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name codequest.example.com;

    ssl_certificate /etc/letsencrypt/live/codequest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codequest.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Código do aluno e conteúdo de autoria cabem com folga.
    client_max_body_size 1m;

    # Tudo vai ao Next; ele mesmo repassa /api/* ao Django (next.config.ts).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SOBRESCREVE, não anexa: o Next repassa o cabeçalho que chega, e o
        # throttle por IP (NUM_PROXIES=1) lê o último item. Anexar deixaria o
        # aluno forjar o próprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
